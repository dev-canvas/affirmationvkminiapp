    <script>
      function initApp() {
        // Пример обработки: если что-то не найдено, включаем режим копирования
        const btn = document.getElementById('copyBtn'); // Укажите ваш ID кнопки
        
        if (btn) {
          console.log('Not found. Switching to copy mode.');
          btn.textContent = 'Скопировать фразу';
          
          btn.onclick = () => {
            const text = 'Ваша фраза здесь'; // Переменная с текстом
            const copyText = `✨ ${text}\n\nЗаходи в мой блог: https://vk.com/aseevi`;
            
            navigator.clipboard.writeText(copyText).then(() => {
              const oldText = btn.textContent;
              btn.textContent = 'Скопировано!';
              setTimeout(() => {
                btn.textContent = oldText;
              }, 2000);
            }).catch(err => {
              alert('Не удалось скопировать: ' + err);
            });
          };
        }
      }

      // Запускаем, когда страница готова
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    </script>
  </body>
</html>
