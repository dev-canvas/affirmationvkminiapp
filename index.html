<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
    <title>Аффирмации для мам</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fff;
        color: #27272a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 16px;
      }
      #affirmation {
        font-size: 1.2rem;
        line-height: 1.4;
        margin: 24px 0;
        opacity: 0;
        transition: opacity 0.3s ease;
        max-width: 360px;
      }
      button {
        background: #0077FF;
        color: #fff;
        border: none;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,119,255,0.25);
        transition: transform 0.1s, opacity 0.2s;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 16px;
        color: #888;
        font-size: 0.85rem;
      }
    </style>
    <!-- ВАЖНО: сначала подключаем VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  </head>
  <body>
    <h1>Твоя фраза-«обнимашка»</h1>

    <!-- Сюда JS напишет фразу -->
    <div id="affirmation">Загрузка...</div>

    <!-- Кнопка с обязательным id="shareBtn" -->
    <button id="shareBtn">Поделиться в сторис</button>
    <div class="hint">Нажми кнопку — откроется сторис с текстом и ссылкой на твой блог</div>

    <script>
      // 1. Получаем мост. Он может быть undefined, если скрипт ещё не загрузился
      const bridge = window.VKBridge;

      const affirmations = [
        "Сегодня я выбираю спокойствие и заботу о себе.",
        "Я справляюсь с тем, что важно прямо сейчас.",
        "Мой день складывается так, как нужно именно мне.",
        "Я делаю достаточно, даже если не всё.",
        "Мои маленькие победы сегодня — это тоже результат.",
        "Мне можно иногда просто быть, а не успевать.",
        "Я учусь быть бережнее к себе день за днём.",
        "У меня есть силы на самое важное.",
        "Сегодня мне хватает времени на главное.",
        "Я доверяю себе и своему ритму."
      ];

      function getRandomAffirmation() {
        return affirmations[Math.floor(Math.random() * affirmations.length)];
      }

      function showAffirmation(text) {
        const el = document.getElementById('affirmation');
        if (el) {
          el.textContent = text;
          el.style.opacity = '1';
        }
      }

      function initApp() {
        const text = getRandomAffirmation();
        showAffirmation(text);

        const btn = document.getElementById('shareBtn');
        if (!btn) return;

        // 2. ГЛАВНОЕ: проверяем, существует ли bridge, прежде чем использовать .send
        if (bridge) {
          // Инициализируем приложение (это безопасно даже при ошибке)
          bridge.send('VKWebAppInit').catch(err => console.error('VK Init error:', err));

          btn.addEventListener('click', () => {
            const link = 'https://vk.com/tvoj_blog'; // <-- ЗАМЕНИ на ссылку своего блога
            const shareText = `✨ \${text}\n\nСохраняй себе, чтобы возвращаться, когда станет тяжело. Заходи в мой блог — там ещё больше поддержки.`;

            // Теперь .send точно сработает, потому что мы проверили bridge выше
            bridge.send('VKWebAppShowShareBox', {
              link: link,
              title: 'Фраза-«обнимашка» для тебя',
              description: shareText
            });
          });
        } else {
          // 3. Если VK Bridge нет (открыли в браузере) — делаем «Скопировать фразу»
          console.warn('VK Bridge not found. Switching to copy mode.');
          btn.textContent = 'Скопировать фразу';
          btn.onclick = () => {
            const copyText = `✨ \${text}\n\nЗаходи в мой блог: https://vk.com/tvoj_blog`; // <-- ЗАМЕНИ ссылку
            navigator.clipboard.writeText(copyText).then(() => {
              const oldText = btn.textContent;
              btn.textContent = 'Скопировано!';
              setTimeout(() => btn.textContent = oldText, 2000);
            }).catch(err => {
              alert('Не удалось скопировать: ' + err);
            });
          };
        }
      }

      // Запускаем, когда страница готова
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    </script>
  </body>
</html>
