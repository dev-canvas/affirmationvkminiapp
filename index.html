<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Аффирмация дня | ВК Мини-апп</title>
    <!-- Подключаем VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 40px 30px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        transition: all 0.3s ease;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .status-badge.vk {
        background: #e8f0ff;
        color: #0077FF;
      }

      .status-badge.browser {
        background: #ffebee;
        color: #FF5252;
      }

      .icon {
        font-size: 48px;
        margin-bottom: 16px;
        display: block;
      }

      h1 {
        font-size: 20px;
        color: #333;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #888;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .affirmation-box {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 16px;
        padding: 30px 20px;
        margin: 20px 0 28px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.5s ease;
      }

      .affirmation-box.fade {
        opacity: 0;
        transform: scale(0.95);
      }

      .affirmation-text {
        font-size: 22px;
        font-weight: 600;
        color: #2d3748;
        line-height: 1.6;
        font-style: italic;
      }

      .affirmation-text .quote-mark {
        color: #667eea;
        font-size: 28px;
        margin: 0 4px;
      }

      .affirmation-counter {
        position: absolute;
        bottom: 10px;
        right: 16px;
        font-size: 12px;
        color: #999;
        font-weight: 500;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }

      .btn {
        padding: 14px 24px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:hover {
        box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        transform: translateY(-2px);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-vk {
        background: #0077FF;
        color: white;
        box-shadow: 0 4px 15px rgba(0, 119, 255, 0.3);
      }

      .btn-vk:hover {
        background: #0066dd;
        box-shadow: 0 6px 25px rgba(0, 119, 255, 0.4);
        transform: translateY(-2px);
      }

      .btn-vk:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-success {
        background: #34c759;
        color: white;
        box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
      }

      .btn-success:hover {
        background: #2db84e;
        transform: translateY(-2px);
      }

      .btn-outline {
        background: transparent;
        color: #667eea;
        border: 2px solid #667eea;
      }

      .btn-outline:hover {
        background: #667eea;
        color: white;
      }

      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: all 0.3s ease;
        pointer-events: none;
        z-index: 1000;
        max-width: 90%;
        text-align: center;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast.success {
        background: rgba(52, 199, 89, 0.95);
      }

      .toast.error {
        background: rgba(255, 82, 82, 0.95);
      }

      .toast.info {
        background: rgba(0, 119, 255, 0.95);
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .share-options {
        display: none;
        margin-top: 12px;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .share-options.show {
        display: flex;
      }

      .share-options .btn {
        flex: 1;
        min-width: 120px;
        font-size: 14px;
        padding: 10px 16px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 28px 20px;
        }

        .affirmation-text {
          font-size: 18px;
        }

        .btn {
          padding: 12px 20px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Статус -->
      <div id="statusBadge" class="status-badge">Загрузка...</div>

      <!-- Иконка -->
      <span class="icon">✨</span>

      <h1>Аффирмация дня</h1>
      <p class="subtitle">Получи порцию вдохновения и поделись с друзьями</p>

      <!-- Блок с аффирмацией -->
      <div id="affirmationBox" class="affirmation-box">
        <div id="affirmationText" class="affirmation-text">
          <span class="quote-mark">"</span>
          <span id="affirmationContent">Нажмите кнопку ниже</span>
          <span class="quote-mark">"</span>
        </div>
        <span id="affirmationCounter" class="affirmation-counter">#1</span>
      </div>

      <!-- Кнопки -->
      <div class="btn-group">
        <button id="newAffirmationBtn" class="btn btn-primary">
          🎲 Новая аффирмация
        </button>
        <button id="shareBtn" class="btn btn-vk" disabled>
          📤 Поделиться
        </button>
        <button id="copyBtn" class="btn btn-outline">
          📋 Скопировать текст
        </button>
      </div>

      <!-- Дополнительные опции -->
      <div id="shareOptions" class="share-options">
        <button id="shareStoryBtn" class="btn btn-vk" style="background: #ff6b6b;">
          📱 В сторис
        </button>
        <button id="shareMessageBtn" class="btn btn-vk" style="background: #4ecdc4;">
          💬 В сообщение
        </button>
        <button id="shareWallBtn" class="btn btn-vk" style="background: #45b7d1;">
          📝 На стену
        </button>
      </div>

      <!-- Уведомление -->
      <div id="toast" class="toast"></div>
    </div>

    <script>
      // ==================== БАЗА АФФИРМАЦИЙ ====================
      const AFFIRMATIONS = [
        "Я принимаю себя и люблю такой, какая я есть",
        "Каждый день я становлюсь сильнее и увереннее",
        "Я достойна всего самого лучшего в этой жизни",
        "Мои возможности безграничны, я могу всё",
        "Я привлекаю успех и процветание в свою жизнь",
        "Мой внутренний свет озаряет путь другим",
        "Я благодарна за каждый момент своей жизни",
        "Мои мысли создают мою реальность",
        "Я излучаю любовь и притягиваю любовь",
        "С каждым днём я становлюсь лучше",
        "Я верю в свои силы и возможности",
        "Моя жизнь наполнена радостью и счастьем",
        "Я выбираю быть счастливой прямо сейчас",
        "Все мои мечты осуществимы",
        "Я в гармонии с собой и миром вокруг",
        "Каждый день приносит мне новые возможности",
        "Я благодарна Вселенной за все дары",
        "Моя уверенность растёт с каждым днём",
        "Я привлекаю только позитивных людей",
        "Мой успех неизбежен, я на правильном пути"
      ];

      // ==================== СОСТОЯНИЕ ====================
      let currentAffirmation = '';
      let currentIndex = 0;
      let isVK = false;
      let isSharing = false;

      // ==================== DOM ЭЛЕМЕНТЫ ====================
      const statusBadge = document.getElementById('statusBadge');
      const affirmationContent = document.getElementById('affirmationContent');
      const affirmationBox = document.getElementById('affirmationBox');
      const affirmationCounter = document.getElementById('affirmationCounter');
      const newBtn = document.getElementById('newAffirmationBtn');
      const shareBtn = document.getElementById('shareBtn');
      const shareStoryBtn = document.getElementById('shareStoryBtn');
      const shareMessageBtn = document.getElementById('shareMessageBtn');
      const shareWallBtn = document.getElementById('shareWallBtn');
      const shareOptions = document.getElementById('shareOptions');
      const copyBtn = document.getElementById('copyBtn');
      const toast = document.getElementById('toast');

      // ==================== VK BRIDGE ====================
      const bridge = window.vkBridge || window.VKBridge;

      // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
      function showToast(message, type = 'info', duration = 3000) {
        toast.textContent = message;
        toast.className = 'toast';
        toast.classList.add(type);
        
        void toast.offsetWidth;
        toast.classList.add('show');
        
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
          toast.classList.remove('show');
        }, duration);
      }

      function getRandomAffirmation() {
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * AFFIRMATIONS.length);
        } while (newIndex === currentIndex && AFFIRMATIONS.length > 1);
        return newIndex;
      }

      function setAffirmation(index) {
        currentIndex = index;
        currentAffirmation = AFFIRMATIONS[index];
        
        affirmationBox.classList.add('fade');
        
        setTimeout(() => {
          affirmationContent.textContent = currentAffirmation;
          affirmationCounter.textContent = `#${index + 1}`;
          affirmationBox.classList.remove('fade');
        }, 300);
      }

      function getAffirmationText() {
        return currentAffirmation || AFFIRMATIONS[0];
      }

      function getShareText() {
        return `✨ Моя аффирмация дня:\n\n"${getAffirmationText()}"\n\n🌟 Поделись вдохновением с друзьями!`;
      }

      // ==================== КОПИРОВАНИЕ ====================
      async function copyAffirmation() {
        const text = getShareText();
        try {
          await navigator.clipboard.writeText(text);
          showToast('✅ Аффирмация скопирована!', 'success');
        } catch (err) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            showToast('✅ Аффирмация скопирована!', 'success');
          } catch (e) {
            showToast('❌ Не удалось скопировать текст', 'error');
          }
          document.body.removeChild(textarea);
        }
      }

      // ==================== ПУБЛИКАЦИЯ В VK ====================
      async function shareToVK(shareType = 'share') {
        if (!isVK) {
          showToast('❌ Функция доступна только внутри ВКонтакте', 'error');
          return;
        }

        if (isSharing) return;
        isSharing = true;
        shareBtn.disabled = true;
        shareBtn.innerHTML = '<span class="loading-spinner"></span> Публикация...';

        try {
          const shareText = getShareText();
          
          // Определяем тип публикации
          let method = 'VKWebAppShare';
          let params = { link: window.location.href };
          
          if (shareType === 'story') {
            // Для сторис используем VKWebAppShowStoryBox если доступно
            try {
              const result = await bridge.send('VKWebAppShowStoryBox', {
                text: shareText,
                background: '#667eea'
              });
              console.log('Story box result:', result);
              if (result && result.result) {
                showToast('✅ Сторис опубликована! 🌟', 'success', 4000);
              } else {
                // Если не сработало, используем обычный шаринг
                throw new Error('Story box not available');
              }
              return;
            } catch (storyError) {
              console.warn('VKWebAppShowStoryBox не доступен, используем VKWebAppShare:', storyError);
              // Используем обычный шаринг с текстом
              params = { 
                link: window.location.href,
                text: shareText
              };
            }
          } else if (shareType === 'message') {
            // Для сообщений используем VKWebAppSendMessage
            try {
              const result = await bridge.send('VKWebAppSendMessage', {
                message: shareText,
                attachment: window.location.href
              });
              console.log('Send message result:', result);
              if (result && result.result) {
                showToast('✅ Сообщение отправлено!', 'success', 3000);
              } else {
                throw new Error('Send message failed');
              }
              return;
            } catch (msgError) {
              console.warn('VKWebAppSendMessage не доступен, используем VKWebAppShare:', msgError);
              params = { 
                link: window.location.href,
                text: shareText
              };
            }
          } else if (shareType === 'wall') {
            // Для стены используем VKWebAppShowWallPostBox
            try {
              const result = await bridge.send('VKWebAppShowWallPostBox', {
                message: shareText,
                attachments: window.location.href
              });
              console.log('Wall post result:', result);
              if (result && result.result) {
                showToast('✅ Запись на стене создана!', 'success', 3000);
              } else {
                throw new Error('Wall post not available');
              }
              return;
            } catch (wallError) {
              console.warn('VKWebAppShowWallPostBox не доступен, используем VKWebAppShare:', wallError);
              params = { 
                link: window.location.href,
                text: shareText
              };
            }
          }

          // Универсальный метод шаринга
          const result = await bridge.send('VKWebAppShare', params);
          console.log('Share result:', result);

          if (result && result.result) {
            let successMessage = '✅ Поделились! 🌟';
            if (shareType === 'story') successMessage = '✅ Сторис опубликована! 🌟';
            else if (shareType === 'message') successMessage = '✅ Сообщение отправлено! 📨';
            else if (shareType === 'wall') successMessage = '✅ Запись на стене создана! 📝';
            showToast(successMessage, 'success', 3000);
          } else {
            showToast('❌ Не удалось опубликовать', 'error');
          }

        } catch (error) {
          console.error('Ошибка публикации:', error);
          showToast('❌ Ошибка: ' + (error.message || 'Неизвестная ошибка'), 'error', 4000);
        } finally {
          isSharing = false;
          shareBtn.disabled = false;
          shareBtn.innerHTML = '📤 Поделиться';
          // Скрываем опции
          shareOptions.classList.remove('show');
        }
      }

      // ==================== ИНИЦИАЛИЗАЦИЯ VK ====================
      async function initVK() {
        if (bridge) {
          try {
            const initResult = await bridge.send('VKWebAppInit', {});
            console.log('VK Bridge инициализирован:', initResult);
            
            isVK = true;
            statusBadge.textContent = '✅ ВКонтакте';
            statusBadge.className = 'status-badge vk';
            shareBtn.disabled = false;
            
            showToast('✅ Приложение подключено к ВКонтакте', 'info', 2000);
            
          } catch (error) {
            console.warn('Ошибка инициализации VK Bridge:', error);
            isVK = false;
            statusBadge.textContent = '⚠️ Ошибка подключения';
            statusBadge.className = 'status-badge browser';
            shareBtn.disabled = true;
            showToast('⚠️ Ошибка подключения к ВКонтакте', 'error');
          }
        } else {
          isVK = false;
          statusBadge.textContent = '⚠️ Вне ВКонтакте';
          statusBadge.className = 'status-badge browser';
          shareBtn.disabled = true;
          showToast('💡 Открой приложение в ВКонтакте', 'info', 3000);
        }
      }

      // ==================== ОБРАБОТЧИКИ СОБЫТИЙ ====================
      newBtn.addEventListener('click', () => {
        const newIndex = getRandomAffirmation();
        setAffirmation(newIndex);
        showToast('✨ Новая аффирмация готова!', 'info', 1500);
        // Скрываем опции при смене
        shareOptions.classList.remove('show');
        shareBtn.textContent = '📤 Поделиться';
      });

      // Основная кнопка "Поделиться" - показывает опции
      shareBtn.addEventListener('click', () => {
        if (!isVK) {
          showToast('❌ Функция доступна только внутри ВКонтакте', 'error');
          return;
        }
        shareOptions.classList.toggle('show');
        if (shareOptions.classList.contains('show')) {
          shareBtn.textContent = '✖️ Скрыть опции';
        } else {
          shareBtn.textContent = '📤 Поделиться';
        }
      });

      // Кнопки для разных типов публикации
      shareStoryBtn.addEventListener('click', () => shareToVK('story'));
      shareMessageBtn.addEventListener('click', () => shareToVK('message'));
      shareWallBtn.addEventListener('click', () => shareToVK('wall'));

      copyBtn.addEventListener('click', copyAffirmation);

      // ==================== ПОДПИСКА НА СОБЫТИЯ VK ====================
      if (bridge) {
        bridge.subscribe((event) => {
          console.log('VK Bridge event:', event);
          
          if (event.detail && event.detail.type === 'VKWebAppShareResult') {
            if (event.detail.data && event.detail.data.result) {
              showToast('✅ Поделились успешно! 🌟', 'success', 3000);
            }
          }
        });
      }

      // ==================== ЗАПУСК ====================
      const initialIndex = Math.floor(Math.random() * AFFIRMATIONS.length);
      setAffirmation(initialIndex);
      initVK();

      console.log('✅ Аффирмация дня готова!');
      console.log(`📋 Всего аффирмаций: ${AFFIRMATIONS.length}`);
    </script>
  </body>
</html>
